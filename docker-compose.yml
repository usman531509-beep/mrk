services:
  postgres:
    image: postgres:16-alpine
    container_name: mrk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mrk
      POSTGRES_PASSWORD: mrk
      POSTGRES_DB: mrk
    ports:
      - "5432:5432"
    volumes:
      - mrk_pgdata:/var/lib/postgresql/data

volumes:
  mrk_pgdata:
